pesos:
  mercado_externo: 0.35
  adrs_brasileiras: 0.25
  vix: 0.10
  tendencia: 0.15
  gap_intensidade: 0.10
  noticias_impacto: 0.05

score_limiares:
  muito_forte: 80
  forte: 60
  moderado: 40
  fraco: 0

# Limiares de gap em % do preço de referência (não mais pontos).
# Ver motor_gap.py (LIMIARES_PCT) para detalhes da calibração.
gap_limiares_pct:
  micro: 0.05
  pequeno: 0.15
  moderado: 0.30
  forte: 0.60
  extremo: 999.0

# ✅ NOVO: Configurações de calibração do motor
configuracoes_motor:
  max_gap_realista: 50000.0     # Gap máximo (pts) antes de considerar anômalo
  margem_faixa_padrao: 100.0    # Margem (pts) para cima/baixo da abertura teórica
  
  direcao_limiares:             # Limiares (pts) usados em _determinar_direcao
    ajuste_confluente: 50.0     # Gap mínimo + posição vs ajuste p/ gerar direção
    absoluto: 100.0             # Gap mínimo absoluto para gerar direção